# ============================================================================
# THE PAPER DIRECTORY — single source of truth
# Used by _includes/paper-directory.html (the cards) and by index.html's
# archive list. Add a paper here and it appears in every place that draws
# from this file; nothing else needs editing.
#
# Every link is built as {template}{code}, so a code appears exactly once.
#   PDF    -> pp_pdf + code + ".pdf"
#   record -> pp_rec + code
#
# Dates: "first posted" is the month of the first deposit. The PDF link reaches
# the current PhilPapers version, which is later than the first posting for every
# paper; where a card says "revised", replace it with the linked version's month
# once read off the record page. Do not date cards by the month they were reviewed.
# ============================================================================

pp_pdf: "https://philpapers.org/archive/"
pp_rec: "https://philpapers.org/rec/"

# --- Section framing (overridable per page via include parameters) ---------
directory:
  eyebrow: "Start here · overview and focused papers"
  heading: "One inversion, one paper at a time."
  intro: >-
    Aethic reasoning proposes that determinacy belongs to the relation between an
    attribute and an observer's information state — the <em>Aethus</em>. These papers
    develop that proposal across counterfactual semantics, the composition of
    alternatives, and quantum measurement, with further applications to causation,
    decision theory, and anthropic reasoning. Each distinguishes its formal results from
    its interpretive commitments and from the physical or empirical questions it leaves
    open. Start with the overview for the argument's shape, consult the comprehensive
    treatment for its full development, or enter through your own field.
  caption: >-
    PDF links go straight to the manuscript; the record link beside each is its
    PhilPapers page, for citation and versions. Each extraction introduces the framework
    needed for its argument and identifies the results it imports from its companions;
    each carries its own provenance note at the end.

# --- The rows -------------------------------------------------------------
rows:
  - id: overview
    label: "Start here"
    note: "— the framework whole, at two lengths"
    cols: 2
    papers:

      # `feature: true` gives a card the attention treatment in the component's CSS
      # (a resting garnet wash, and a lit border, sheen, and pulse on mouse-over).
      # Reserved for the two entry points; adding it elsewhere dilutes it.
      - key: comprehensive
        code: "BENARA-5"
        feature: true
        label: "Start here · The full treatment"
        title: "Aethic Reasoning"
        subtitle: "A comprehensive solution to the quantum measurement problem"
        blurb: >-
          The fullest development of Aethic reasoning: its information states, composition
          regimes, consistency postulates, and quantitative weighting, followed through
          quantum measurement, causation, decision theory, time, and anthropic reasoning.
          The extraction papers present individual arguments in disciplinary form; this
          manuscript develops their shared framework and connections, including the
          assumptions and open constructions on which the program depends. Long, and not
          the quickest way in; the place all the others point.
        meta: "The comprehensive treatment · source of record · first deposited November 2024 · revised"
        flag: "Start here · full"
        list_title: "Aethic Reasoning: A Comprehensive Solution to the Quantum Measurement Problem"
        list_meta: "First deposited November 2024, revised · the comprehensive treatment · source of record · direct PDF"

      - key: inbrief
        code: "BENARI-3"
        feature: true
        label: "Start here · Overview"
        title: "Aethic Reasoning in Brief"
        subtitle: "From a counterfactual semantics to the quantum measurement problem"
        blurb: >-
          The map of the framework: determinacy indexed to information states, mutual
          exclusion expressed as interior content, and admissibility governed by
          consistency across declared refinements. The overview connects counterfactual
          evaluation to the record-based quantum–classical boundary and the finite
          path-kernel representation of measurement. It identifies which companion owns
          each result and separates the quantitative axiom, the physical interpretation,
          and the remaining open questions.
        meta: "The compressed companion · the map of the framework · first posted July 2026, revised"
        flag: "Start here"
        list_title: "Aethic Reasoning in Brief: From a Counterfactual Semantics to the Quantum Measurement Problem"
        list_meta: "First posted July 2026, revised · overview · the compressed companion · direct PDF"

  - id: derivation
    label: "The derivation"
    note: "— three moves, in order"
    cols: 3
    papers:

      - key: semantics
        code: "BENCEB-2"
        label: "№ 1 · Modality"
        title: "Counterfactual Evaluation by Perturbation of Information States"
        subtitle: "Deleting the world-similarity ordering, not refining it"
        blurb: >-
          Counterfactuals are evaluated by reopening, restating, and pruning an information
          state, with <em>would</em>, <em>might</em>, and <em>the probability that</em> read
          from the surviving alternatives. Under the stated reading of conjunctive
          antecedents, an explicit countermodel rules out smooth preferential
          representation of the resulting consequence relation. World-similarity ordering
          is absent from the clauses; support priorities, scope choices, and quantitative
          weights remain explicit parts of the proposal.
        meta: "Home field: semantics of conditionals · assumes no physics · first posted July 2026, revised"
        flag: "Trio · № 1"
        list_title: "Counterfactual Evaluation by Perturbation of Information States: Deleting the World-Similarity Ordering, Not Refining It"
        list_meta: "First posted July 2026, revised · extraction paper · semantics of conditionals · direct PDF"

      - key: exclusivity
        code: "BENEAA-9"
        label: "№ 2 · Logic"
        title: "Exclusivity as Achievement"
        subtitle: "Relocating mutual exclusion to the interior, and the composition regime that falls out"
        blurb: >-
          What if alternatives exclude one another because of content they carry, rather
          than because exclusion is built into their composition? Given a primitive
          composition of alternatives, the paper distinguishes agreeing and disagreeing
          regimes by their interior negations. It develops the distinction's implications
          for color exclusion and metaphysical indeterminacy, while separating the formal
          proposal from the physical question of its realization.
        meta: "Home field: logic &amp; metaphysics · the physics quarantined · first posted July 2026, revised"
        flag: "Trio · № 2"
        list_title: "Exclusivity as Achievement: Relocating Mutual Exclusion to the Interior, and the Composition Regime That Falls Out"
        list_meta: "First posted July 2026, revised · extraction paper · logic &amp; metaphysics · direct PDF"

      - key: boundary
        code: "BENTQB"
        label: "№ 3 · Measurement"
        title: "Quantum Mechanics from Records"
        subtitle: "Measurement structure on a finite path-kernel domain"
        blurb: >-
          On a finite path-kernel domain, consistency constraints classify candidate path
          sets relative to a complete, persistent record structure. An explicit kernel
          supplies the quantitative representation: Hilbert states, record observables, and
          Born statistics. A stipulated record-compatible restriction is represented by
          Lüders conditioning. The paper distinguishes these results from completeness
          claims and from the physical assumptions needed to apply the same admissibility
          criterion to a friend's laboratory.
        meta: "Home field: quantum foundations · assumptions inventoried · first posted July 2026, revised"
        flag: "Trio · № 3"
        list_title: "Quantum Mechanics from Records: Measurement Structure on a Finite Path-Kernel Domain"
        list_meta: "First posted July 2026, revised · extraction paper · quantum foundations · direct PDF"


  - id: interpretation
    label: "The payoff"
    note: "— what the relocation buys in quantum mechanics, stated whole"
    cols: 1
    papers:

      - key: determinacy
        code: "BENTRO-72"
        label: "Quantum interpretation · the central proposal"
        title: "Determinacy as a Two-Place Relation"
        subtitle: "The category mistake in quantum interpretation, and the dissolution of the paradox set"
        blurb: >-
          The paper proposes that determinacy is a relation between an attribute and an
          information state, and develops its consequences for quantum interpretation. A
          conditional no-go excludes uniform noncontextual, measurement-independent
          completions reproducing the relevant quantum statistics; contextual alternatives
          remain open. The same framework addresses delayed choice, Schrödinger's cat,
          Wigner's friend, and related cases, with each application's assumptions
          identified and Frauchiger–Renner's disputed physical premise made explicit.
        meta: "Home field: quantum interpretation · conditional no-go and worked applications · first posted August 2026, revised"
        list_title: "Determinacy as a Two-Place Relation: The Category Mistake in Quantum Interpretation, and the Dissolution of the Paradox Set"
        list_meta: "First posted August 2026, revised · extraction paper · quantum interpretation · direct PDF"

  - id: applications
    label: "The applications"
    note: "— the same relocation, run at standing problems in four fields"
    cols: 2
    modifier: "pdir-row-alt"
    papers:

      - key: newcomb
        code: "BENNPW"
        label: "Decision theory"
        title: "Newcomb's Problem Without a Fixed Past"
        subtitle: "A decision rule from observer-indexed determinacy"
        blurb: >-
          An unread prediction can remain open relative to the deciding agent even when it
          lies in the past. The paper asks what makes an act-supposition well-defined on
          such an information state, then develops a branch-conditional settling policy and
          its benchmark verdicts for Newcomb's problem, the smoking lesion, and transparent
          variants. Indexed determinacy motivates the policy; the policy and the stated
          dependence assumptions supply the decisions.
        meta: "Home field: decision theory · assumes no physics · first posted July 2026, revised"
        list_title: "Newcomb's Problem Without a Fixed Past: A Decision Rule From Observer-Indexed Determinacy"
        list_meta: "First posted July 2026, revised · extraction paper · decision theory · direct PDF"

      - key: causality
        code: "BENCWT-4"
        label: "Causation"
        title: "Causality from Indexed Information States"
        subtitle: "Screening, intervention, and the Bell obstruction"
        blurb: >-
          Indexed information states provide a representation of statistical dependence in
          which factorization yields screening results. With additional directed mechanism
          structure, settling reproduces interventions and functional-model
          counterfactuals. Bell correlations delimit the noncontextual,
          measurement-independent joint-valuation representation. The philosophical
          proposal replaces causal production with coupling structure, while keeping that
          interpretation distinct from the mathematical correspondences.
        meta: "Home field: causation · answers the Wood–Spekkens diagnosis · first posted July 2026, revised"
        list_title: "Causality from Indexed Information States: Screening, Intervention, and the Bell Obstruction"
        list_meta: "First posted July 2026, revised · extraction paper · causation · direct PDF"

      - key: copernican
        code: "BENTCM-7"
        wing: nexic
        label: "Anthropics · the Nexic wing · foundation"
        title: "The Copernican Method Against the Copernican Principle"
        subtitle: "Anthropic typicality over partial information states"
        blurb: >-
          The Accordance Principle turns an observer-conditioned sampling model into
          calibrated constraints on observer abundance. Under stated assumptions about
          predeclared attributes and their probabilities, rare realized records can reject
          an abundance hypothesis. The paper develops the resulting statistical challenge
          to the astrobiological Copernican principle and distinguishes it from a logical
          contradiction, from an empirically established rarity estimate, and from the
          elimination of every sampling-measure choice.
        meta: "Home field: anthropic reasoning · the Nexic wing's foundation · first posted July 2026, revised"
        list_title: "The Copernican Method Against the Copernican Principle: Anthropic Typicality over Partial Information States"
        list_meta: "First posted July 2026, revised · extraction paper · anthropics, the Nexic wing · direct PDF"

      - key: optimalearth
        code: "BENTOE-4"
        wing: nexic
        label: "Anthropics · the Nexic wing · natural history"
        title: "The Optimal Earth"
        subtitle: "Conditional concentration of observer-weighted natural histories"
        blurb: >-
          Under a stated contrast-distribution hypothesis, Strong Accordance bounds how
          often a realized side carries little observer-conditioned weight. The paper
          develops concentration results and, with a separate cumulative-suppression
          assumption, bounds the aggregate contribution of alternative histories. It
          proposes that these conditions characterize natural history: a conditional
          mathematical account of concentration, with its applicability to Earth presented
          as an empirical conjecture.
        meta: "Home field: anthropic reasoning · builds on the foundation beside it · first posted July 2026, revised"
        list_title: "The Optimal Earth: Conditional Concentration of Observer-Weighted Natural Histories"
        list_meta: "First posted July 2026, revised · extraction paper · anthropics, the Nexic wing · direct PDF"

  - id: apparatus
    label: "The apparatus"
    note: "— the formal face of the same states"
    cols: 1
    modifier: "pdir-row-alt"
    papers:

      - key: weightalgebra
        code: "BENTWA-5"
        label: "Algebra"
        title: "The Weight Algebra of Aethae"
        subtitle: "A two-layer commutative semiring for superposition and pruning"
        blurb: >-
          The formal apparatus distinguishes information content, declared refinement, and
          weighted composition. It constructs a weighted monoid semiring, derives a
          factorization identity, and gives the consistency rule a fixed-point formulation.
          The intrinsic semiring requires an explicit distributivity hypothesis; finite
          models with stated regimes support an exact validity quotient. Algebraic
          valuations are distinguished from empirical probabilities, with the Born
          weighting treated in the quantum companion.
        meta: "Home field: algebra · the formal companion to № 1 · first posted July 2026, revised"
        list_title: "The Weight Algebra of Aethae: A Two-Layer Commutative Semiring for Superposition and Pruning"
        list_meta: "First posted July 2026, revised · extraction paper · algebra · direct PDF"

