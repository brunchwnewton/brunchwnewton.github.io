<!-- Glossary Auto-Linker: include in default.html layout -->
<!-- Fetches /glossary.html, parses terms, wraps first occurrences with hover tooltips -->
<style>
/* Glossary tooltip spans */
span.gterm-link {
  color: inherit;
  text-decoration: none;
  border-bottom: 1px dotted rgba(110,92,255,0.3);
  position: relative;
  cursor: help;
  transition: border-color 0.2s;
}
span.gterm-link:hover {
  border-bottom-color: rgba(110,92,255,0.6);
}
.gterm-tooltip {
  position: fixed;
  width: 360px;
  max-width: 90vw;
  background: #161625;
  border: 1px solid rgba(110,92,255,0.25);
  border-radius: 8px;
  padding: 0.7rem 0.9rem;
  box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  z-index: 500;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.15s;
  font-size: 0.8rem;
  line-height: 1.5;
  font-weight: 400;
  font-style: normal;
  text-align: left;
  display: none;
}
.gterm-tooltip-name {
  font-weight: 600;
  color: #f0f0ff;
  font-size: 0.82rem;
  margin-bottom: 0.25rem;
}
.gterm-tooltip-def {
  color: #d4d4e8;
  font-size: 0.78rem;
}
.gterm-tooltip-tag {
  display: inline-block;
  font-size: 0.58rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  padding: 0.1rem 0.35rem;
  border-radius: 3px;
  margin-left: 0.4rem;
  vertical-align: middle;
  position: relative;
  top: -1px;
}
.gterm-tooltip-tag.t-aethic { background: rgba(96,165,250,0.15); color: rgba(96,165,250,0.8); }
.gterm-tooltip-tag.t-nexic { background: rgba(251,191,36,0.15); color: rgba(251,191,36,0.8); }
.gterm-tooltip-tag.t-both { background: rgba(110,92,255,0.15); color: rgba(167,139,250,0.8); }
</style>

<script>
(function() {
  // Only run on non-glossary pages
  if (window.location.pathname.indexOf('glossary') !== -1) return;

  // Wait for DOM
  document.addEventListener('DOMContentLoaded', function() {
    // Fetch glossary
    fetch('/glossary.html')
      .then(function(r) { return r.ok ? r.text() : null; })
      .then(function(html) {
        if (!html) return;
        var parser = new DOMParser();
        var doc = parser.parseFromString(html, 'text/html');
        var gterms = doc.querySelectorAll('.gterm[id]');
        if (!gterms.length) return;

        // Build term list
        var terms = [];
        gterms.forEach(function(el) {
          var id = el.id;
          var nameEl = el.querySelector('.gterm-name');
          if (!nameEl) return;
          // Get clean name (strip tag spans)
          var name = nameEl.childNodes[0].textContent.trim();
          var defEl = el.querySelector('.gterm-def');
          var def = defEl ? defEl.textContent.trim() : '';
          // Framework tag
          var tagEl = nameEl.querySelector('.framework-tag');
          var tag = '';
          if (tagEl) {
            if (tagEl.classList.contains('tag-aethic')) tag = 'aethic';
            else if (tagEl.classList.contains('tag-nexic')) tag = 'nexic';
            else tag = 'both';
          }
          // Search phrases: from data-aliases (pipe-separated) + the name itself
          var searchPhrases = [];
          var aliases = el.getAttribute('data-aliases');
          if (aliases) {
            aliases.split('|').forEach(function(a) {
              a = a.trim();
              if (a && searchPhrases.indexOf(a) === -1) searchPhrases.push(a);
            });
          }
          // Also add the display name and clean name
          if (searchPhrases.indexOf(name) === -1) searchPhrases.push(name);
          var cleanName = name.replace(/\s*\(.*?\)/g, '').trim();
          if (cleanName !== name && searchPhrases.indexOf(cleanName) === -1) searchPhrases.push(cleanName);
          // Handle slash variants
          if (cleanName.indexOf(' / ') !== -1) {
            cleanName.split(' / ').forEach(function(p) {
              p = p.trim();
              if (p && searchPhrases.indexOf(p) === -1) searchPhrases.push(p);
            });
          }

          terms.push({
            id: id,
            name: name,
            cleanName: cleanName,
            phrases: searchPhrases,
            def: def,
            tag: tag
          });
        });

        // Build flat list of (phrase, termObj) sorted longest-first
        var phraseList = [];
        terms.forEach(function(t) {
          t.phrases.forEach(function(p) {
            phraseList.push({ phrase: p, term: t });
          });
        });
        phraseList.sort(function(a, b) { return b.phrase.length - a.phrase.length; });

        // Find content areas to scan
        var containers = document.querySelectorAll('.layer-body, .detail-inner, .pitch, .article-wrap');
        if (!containers.length) return;

        var linkCount = 0;

        // Debug: log what we found
        console.log('[Glossary tooltips] Loaded ' + terms.length + ' terms (' + phraseList.length + ' phrases), scanning ' + containers.length + ' containers');

        // For each container, for each phrase, find and link ALL occurrences
        phraseList.forEach(function(item) {
          var phrase = item.phrase;
          // Build regex: whole word, case-insensitive, global
          var escaped = phrase.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
          var regex = new RegExp('\\b' + escaped + '\\b', 'gi');

          // Walk text nodes in each container, link ALL occurrences
          for (var ci = 0; ci < containers.length; ci++) {
            // Restart walk after each replacement since DOM changes
            var found = true;
            while (found) {
              found = false;
              var walker = document.createTreeWalker(
                containers[ci],
                NodeFilter.SHOW_TEXT,
                {
                  acceptNode: function(node) {
                    var p = node.parentElement;
                    if (!p) return NodeFilter.FILTER_REJECT;
                    var tag = p.tagName;
                    if (tag === 'A' || tag === 'H1' || tag === 'H2' || tag === 'H3' || tag === 'H4' ||
                        tag === 'BUTTON' || tag === 'SCRIPT' || tag === 'STYLE' || tag === 'CODE' ||
                        tag === 'SVG' || tag === 'TEXT') return NodeFilter.FILTER_REJECT;
                    if (p.closest('a, button, script, style, svg, .formal-label, .ki-label, .layer-title, .layer-role, .detail-label, .gterm-tooltip, .gterm-link'))
                      return NodeFilter.FILTER_REJECT;
                    return NodeFilter.FILTER_ACCEPT;
                  }
                }
              );

              var node;
              while (node = walker.nextNode()) {
                regex.lastIndex = 0; // reset for global regex
                var match = regex.exec(node.textContent);
                if (!match) continue;

                // Split text node and insert link
                var before = node.textContent.substring(0, match.index);
                var matched = node.textContent.substring(match.index, match.index + match[0].length);
                var after = node.textContent.substring(match.index + match[0].length);

                var beforeNode = document.createTextNode(before);
                var afterNode = document.createTextNode(after);

                var link = document.createElement('span');
                link.className = 'gterm-link';
                link.textContent = matched;

                // Build tooltip
                var tooltip = document.createElement('span');
                tooltip.className = 'gterm-tooltip';
                var tagHtml = '';
                if (item.term.tag === 'both') {
                  tagHtml = '<span class="gterm-tooltip-tag t-aethic">Aethic</span> <span class="gterm-tooltip-tag t-nexic">Nexic</span>';
                } else {
                  var tagClass = item.term.tag === 'aethic' ? 't-aethic' : 't-nexic';
                  tagHtml = '<span class="gterm-tooltip-tag ' + tagClass + '">' + item.term.tag + '</span>';
                }
                tooltip.innerHTML =
                  '<div class="gterm-tooltip-name">' + item.term.cleanName +
                  ' ' + tagHtml + '</div>' +
                  '<div class="gterm-tooltip-def">' + item.term.def + '</div>';
                link.appendChild(tooltip);

                // Position tooltip on hover using fixed coords (escapes overflow:hidden)
                link.addEventListener('mouseenter', function() {
                  var tt = this.querySelector('.gterm-tooltip');
                  if (!tt) return;
                  var rect = this.getBoundingClientRect();
                  var ttWidth = 360;
                  // Horizontal: center on the word, clamp to viewport
                  var left = rect.left + rect.width / 2 - ttWidth / 2;
                  left = Math.max(8, Math.min(left, window.innerWidth - ttWidth - 8));
                  tt.style.left = left + 'px';
                  // Vertical: prefer above, flip below if near top
                  tt.style.display = 'block';
                  tt.style.opacity = '0';
                  var ttHeight = tt.offsetHeight;
                  if (rect.top > ttHeight + 12) {
                    tt.style.top = (rect.top - ttHeight - 8) + 'px';
                  } else {
                    tt.style.top = (rect.bottom + 8) + 'px';
                  }
                  tt.style.opacity = '1';
                });
                link.addEventListener('mouseleave', function() {
                  var tt = this.querySelector('.gterm-tooltip');
                  if (!tt) return;
                  tt.style.opacity = '0';
                  tt.style.display = 'none';
                });

                var parent = node.parentNode;
                parent.insertBefore(beforeNode, node);
                parent.insertBefore(link, node);
                parent.insertBefore(afterNode, node);
                parent.removeChild(node);

                linkCount++;
                found = true; // restart walker for this container
                break; // break inner walker loop, restart outer while
              }
            }
          }
        });

        // Hide all tooltips on scroll
        var scrollTimer;
        window.addEventListener('scroll', function() {
          if (scrollTimer) clearTimeout(scrollTimer);
          scrollTimer = setTimeout(function() {
            document.querySelectorAll('.gterm-tooltip').forEach(function(tt) {
              tt.style.opacity = '0';
              tt.style.display = 'none';
            });
          }, 50);
        }, true);

        // Debug: summary
        console.log('[Glossary tooltips] Created ' + linkCount + ' tooltip links');
      })
      .catch(function(e) {
        // Glossary fetch failed (local preview, offline, etc.) — degrade gracefully
        console.log('Glossary tooltips: fetch failed, skipping.', e);
      });
  });
})();
</script>
