<style>

.topnav{position:sticky;top:0;z-index:100;background:rgba(21,22,16,.93);backdrop-filter:saturate(140%) blur(8px);-webkit-backdrop-filter:saturate(140%) blur(8px);border-bottom:1px solid #2a2b22;transition:box-shadow .3s;}

.topnav-brand .bar{color:var(--garnet-2,#9C2A3C);}
.topnav-links{display:flex;align-items:center;gap:1.25rem;}
.topnav-links a{font-family:var(--mono,"IBM Plex Mono",ui-monospace,Menlo,monospace);font-size:.72rem;letter-spacing:.05em;color:var(--on-block-2,#9C9A8D);text-decoration:none;position:relative;transition:color .15s;white-space:nowrap;}
.topnav-links a:hover{color:var(--on-block,#EAE9E1);}
.topnav-links a::after{content:'';position:absolute;left:0;bottom:-4px;width:0;height:1.5px;background:var(--garnet-2,#9C2A3C);transition:width .25s;}

.topnav-more.open .topnav-dropdown{display:block;}
.topnav-dropdown a{display:block;padding:.5rem 1rem;font-family:var(--mono,"IBM Plex Mono",ui-monospace,Menlo,monospace);font-size:.72rem;letter-spacing:.04em;color:var(--on-block-2,#9C9A8D);text-decoration:none;transition:background .12s,color .12s;}

<script>
(function(){
  var tn=document.getElementById('topnav');
  if(tn){window.addEventListener('scroll',function(){tn.classList.toggle('scrolled',window.scrollY>30);});}
  document.addEventListener('click',function(e){
    var m=document.querySelector('.topnav-more');
    if(m&&!m.contains(e.target)){m.classList.remove('open');var b=m.querySelector('.topnav-more-btn');if(b)b.setAttribute('aria-expanded','false');}
  });
  var mb=document.querySelector('.topnav-more-btn');
  if(mb){mb.addEventListener('click',function(){mb.setAttribute('aria-expanded', mb.parentElement.classList.contains('open')?'true':'false');});}
})();
</script>
